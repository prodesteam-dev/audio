<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>File nghe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 480px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    audio {
      width: 100%;
      margin-bottom: 15px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      padding: 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    li:hover {
      background: #f0f4ff;
    }
    li.active {
      background: #e6ecff;
      font-weight: bold;
      color: #1a4cff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>File nghe</h1>

    <audio id="player" controls></audio>

    <ul id="playlist">
      <li data-src="Unit_1.mp3">Unit 1</li>
      <li data-src="Unit_2.mp3">Unit 2</li>
      <li data-src="Unit_3.mp3">Unit 3</li>
      <li data-src="Unit_4.mp3">Unit 4</li>
      <li data-src="Unit_5.mp3">Unit 5</li>
      <li data-src="Unit_6.mp3">Unit 6</li>
      <li data-src="Unit_7.mp3">Unit 7</li>
      <li data-src="Unit_8.mp3">Unit 8</li>
      <li data-src="Final_test_1.mp3">Final Test 1</li>
    </ul>
  </div>

  <script>
    const player = document.getElementById("player");
    const items = document.querySelectorAll("#playlist li");

    items.forEach(item => {
      item.addEventListener("click", () => {
        items.forEach(i => i.classList.remove("active"));
        item.classList.add("active");
        player.src = item.dataset.src;
        player.play();
      });
    });
  </script>

</body>
</html>
